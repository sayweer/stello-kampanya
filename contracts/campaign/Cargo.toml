[package]
name = "stello-campaign"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# The integration test registers Stello's router from its compiled wasm
# (contracts/campaign/router.wasm) — no source dependency on the layer.
